server:
  port: 9300
  servlet:
    context-path: /wzkris-risk-api

spring:
  application:
    name: wzkris-risk
  profiles:
    active: @profiles.active@

risk:
  fail-threshold: 5
  fail-window-seconds: 600
  ip-limit-threshold: 80
  ip-limit-window-seconds: 60
  path-burst-threshold: 30
  path-burst-window-seconds: 60
  ip-drift-window-minutes: 30
  ua-mutation-window-minutes: 30
  # 是否允许本地来源（127.0.0.1、localhost）的访问，开发环境建议设为 true
  allow-local-source: true
  # 是否拦截空 User-Agent 的请求，生产环境可根据需要设为 true
  block-empty-user-agent: false
